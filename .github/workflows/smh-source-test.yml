name: SMH source test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test SMH filing feed
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          def fail(message):
              print(message, flush=True)
              raise SystemExit(1)

          user_agent = os.environ.get("SEC_USER_AGENT", "").strip()
          if (
              "@" not in user_agent
              or "\n" in user_agent
              or "\r" in user_agent
          ):
              fail("FAIL: Check SEC_USER_AGENT secret.")

          series = "S000034411"

          def fetch(url):
              parsed = urllib.parse.urlparse(url)
              if (
                  parsed.scheme != "https"
                  or parsed.hostname != "www.sec.gov"
              ):
                  fail("FAIL: Unexpected source URL.")

              for attempt in range(1, 4):
                  try:
                      time.sleep(1)
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": user_agent},
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          final = urllib.parse.urlparse(response.geturl())
                          if final.scheme != "https" or final.hostname != "www.sec.gov":
                              fail("FAIL: Unexpected redirect.")
                          return response.read()

                  except urllib.error.HTTPError as error:
                      status = error.code
                      if status in (403, 429):
                          fail(
                              f"FAIL: SEC HTTP {status}. "
                              "Access restricted; stop and try later."
                          )
                      if status not in (500, 502, 503, 504):
                          fail(f"FAIL: SEC HTTP {status}.")
                      print(
                          f"RETRY: HTTP {status}, attempt {attempt}/3.",
                          flush=True,
                      )

                  except (urllib.error.URLError, TimeoutError, OSError) as error:
                      print(
                          f"RETRY: {type(error).__name__}, attempt {attempt}/3.",
                          flush=True,
                      )

                  if attempt < 3:
                      time.sleep(5 * attempt)

              fail("FAIL: Could not read SEC data after 3 attempts.")

          query = urllib.parse.urlencode({
              "action": "getcompany",
              "CIK": series,
              "owner": "exclude",
              "count": "40",
              "output": "atom",
          })
          feed_url = "https://www.sec.gov/cgi-bin/browse-edgar?" + query
          payload = fetch(feed_url)

          try:
              root = ET.fromstring(payload)
          except ET.ParseError:
              fail("FAIL: SEC response is not valid XML.")

          ns = {"a": "http://www.w3.org/2005/Atom"}
          if root.tag != "{http://www.w3.org/2005/Atom}feed":
              fail("FAIL: Expected an Atom feed.")

          entries = root.findall("a:entry", ns)
          print(f"FEED_ENTRIES: {len(entries)}", flush=True)

          if not entries:
              fail("FAIL: Feed is empty; cannot validate SMH filtering.")

          checked = 0
          for entry in entries[:3]:
              title = entry.findtext("a:title", default="", namespaces=ns)
              updated = entry.findtext("a:updated", default="", namespaces=ns)

              links = [
                  link.get("href", "")
                  for link in entry.findall("a:link", ns)
                  if link.get("rel", "alternate") == "alternate"
              ]
              if not links:
                  fail("FAIL: Filing entry has no document link.")

              link = urllib.parse.urljoin(feed_url, links[0])
              path = urllib.parse.urlparse(link).path
              if not path.startswith("/Archives/edgar/data/1137360/"):
                  fail("FAIL: Unexpected filing location.")

              page = fetch(link).decode("utf-8", errors="replace")
              if not re.search(r"\b" + re.escape(series) + r"\b", page):
                  fail("FAIL: Filing page does not identify the SMH series.")

              print(
                  "VERIFIED " + json.dumps({
                      "title": title,
                      "updated": updated,
                      "series": series,
                      "url": link,
                  }, ensure_ascii=True),
                  flush=True,
              )
              checked += 1

          print(
              f"PASS: SMH feed readable; {checked} filing pages identify its series.",
              flush=True,
          )
          print("A filing may cover SMH together with other funds.")
          print("Monitoring and Telegram delivery are not active yet.")
          PY
