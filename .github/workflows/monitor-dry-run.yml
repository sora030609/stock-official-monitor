name: Monitor dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-official-monitor
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Read repository files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile monitor.py

      - name: Test all monitoring sources
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -u monitor.py --dry-run

      - name: Confirm state file unchanged
        if: always()
        run: git diff --exit-code -- state.json
