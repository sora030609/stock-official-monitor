name: Taiwan source test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository files
        uses: actions/checkout@v4

      - name: Test TWSE announcements
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import time
          import urllib.request

          with open("config.json", encoding="utf-8") as file:
              config = json.load(file)

          stocks = config.get("taiwan_stocks")
          if not isinstance(stocks, list) or not stocks:
              sys.exit("FAIL: taiwan_stocks must be a nonempty list.")

          targets = {str(code).strip() for code in stocks}
          url = "https://openapi.twse.com.tw/v1/opendata/t187ap04_L"
          rows = None

          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "StockOfficialMonitor/1.0",
                          "Accept": "application/json",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read().decode("utf-8-sig")
                  rows = json.loads(payload)
                  break
              except Exception as error:
                  print(
                      f"Attempt {attempt}/3 failed: "
                      f"{type(error).__name__}",
                      flush=True,
                  )
                  if attempt < 3:
                      time.sleep(5 * attempt)

          if rows is None:
              sys.exit("FAIL: Could not read TWSE data after 3 attempts.")

          if not isinstance(rows, list):
              sys.exit("FAIL: Expected a JSON list; source format may have changed.")

          print(f"Source returned {len(rows)} announcements.", flush=True)

          if not rows:
              print("EMPTY: No rows available; field validation is pending.")
              print("This does not prove there were no announcements today.")
              sys.exit(0)

          required = {"公司代號", "公司名稱", "主旨"}
          normalized_rows = []

          for index, row in enumerate(rows):
              if not isinstance(row, dict):
                  sys.exit(f"FAIL: Row {index} is not an object.")

              # 清除欄位名稱前後空白，例如「主旨 」轉為「主旨」。
              cleaned = {}
              for key, value in row.items():
                  clean_key = key.strip()
                  if clean_key in cleaned:
                      sys.exit(
                          f"FAIL: Duplicate field after normalization in row {index}."
                      )
                  cleaned[clean_key] = value

              if not required.issubset(cleaned):
                  print(
                      "ACTUAL_FIELDS: "
                      + json.dumps(list(cleaned.keys()), ensure_ascii=False),
                      flush=True,
                  )
                  print(
                      "MISSING_FIELDS: "
                      + json.dumps(
                          sorted(required - set(cleaned.keys())),
                          ensure_ascii=False,
                      ),
                      flush=True,
                  )
                  sys.exit("FAIL: Unexpected announcement fields.")

              normalized_rows.append(cleaned)

          matches = [
              row for row in normalized_rows
              if str(row["公司代號"]).strip() in targets
          ]

          print("PASS: Connection, JSON format, and required fields are valid.")
          print(f"Watchlist matches: {len(matches)}")

          for row in matches[:20]:
              summary = {
                  "code": row["公司代號"],
                  "company": row["公司名稱"],
                  "subject": str(row["主旨"]).strip()[:200],
              }
              print("MATCH " + json.dumps(summary, ensure_ascii=False))

          if not matches:
              print("No watchlist matches in the returned dataset.")
              print("This is not an error and does not validate ticker membership.")
          PY
