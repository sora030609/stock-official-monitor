name: US source test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read repository files
        uses: actions/checkout@v4

      - name: Test SEC submissions
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          def fail(message):
              print(message, flush=True)
              raise SystemExit(1)

          user_agent = os.environ.get("SEC_USER_AGENT", "").strip()
          if (
              "@" not in user_agent
              or "\n" in user_agent
              or "\r" in user_agent
          ):
              fail("FAIL: Check SEC_USER_AGENT secret.")

          with open("config.json", encoding="utf-8") as file:
              config = json.load(file)

          stocks = config.get("us_stocks")
          forms = config.get("sec_forms")
          if not isinstance(stocks, list) or not stocks:
              fail("FAIL: us_stocks must be a nonempty list.")
          if not isinstance(forms, list) or not forms:
              fail("FAIL: sec_forms must be a nonempty list.")

          targets = list(dict.fromkeys(
              str(symbol).strip().upper() for symbol in stocks
          ))
          wanted_forms = set(forms)

          cik_map = {
              "NVDA": "0001045810",
              "MU": "0000723125",
              "MRVL": "0001835632",
              "GLW": "0000024741",
              "INTC": "0000050863",
              "NOK": "0000924613",
          }

          unknown = [symbol for symbol in targets if symbol not in cik_map]
          if unknown:
              fail("FAIL: Unsupported ticker in this test: " + ", ".join(unknown))

          def fetch_json(url, symbol):
              for attempt in range(1, 4):
                  try:
                      time.sleep(1)
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": user_agent,
                              "Accept": "application/json",
                          },
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.load(response)

                  except urllib.error.HTTPError as error:
                      status = error.code
                      if status in (403, 429):
                          fail(
                              f"FAIL {symbol}: SEC HTTP {status}. "
                              "Access restricted; stop and try later."
                          )
                      if status not in (500, 502, 503, 504):
                          fail(f"FAIL {symbol}: SEC HTTP {status}.")
                      print(
                          f"RETRY {symbol}: HTTP {status}, attempt {attempt}/3.",
                          flush=True,
                      )

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      OSError,
                      ValueError,
                  ) as error:
                      print(
                          f"RETRY {symbol}: {type(error).__name__}, "
                          f"attempt {attempt}/3.",
                          flush=True,
                      )

                  if attempt < 3:
                      time.sleep(5 * attempt)

              fail(f"FAIL {symbol}: Could not read SEC data after 3 attempts.")

          passed = 0

          for symbol in targets:
              cik = cik_map[symbol]
              data = fetch_json(
                  f"https://data.sec.gov/submissions/CIK{cik}.json",
                  symbol,
              )

              if not isinstance(data, dict):
                  fail(f"FAIL {symbol}: Expected a JSON object.")

              if str(data.get("cik", "")).lstrip("0") != cik.lstrip("0"):
                  fail(f"FAIL {symbol}: CIK does not match.")

              tickers = data.get("tickers")
              if not isinstance(tickers, list) or symbol not in tickers:
                  fail(f"FAIL {symbol}: Ticker does not match SEC company data.")

              filings = data.get("filings")
              recent = filings.get("recent") if isinstance(filings, dict) else None
              if not isinstance(recent, dict):
                  fail(f"FAIL {symbol}: Missing recent filings.")

              fields = (
                  "form",
                  "filingDate",
                  "accessionNumber",
                  "primaryDocument",
              )
              if any(not isinstance(recent.get(key), list) for key in fields):
                  fail(f"FAIL {symbol}: Unexpected filing fields.")

              lengths = {len(recent[key]) for key in fields}
              if len(lengths) != 1:
                  fail(f"FAIL {symbol}: Filing column lengths differ.")

              count = len(recent["form"])
              if count == 0:
                  fail(f"FAIL {symbol}: Recent filings list is empty.")

              matches = [
                  index for index, form in enumerate(recent["form"])
                  if form in wanted_forms
              ]

              print(
                  f"PASS {symbol}: CIK and ticker verified; "
                  f"recent filings={count}; matching forms={len(matches)}",
                  flush=True,
              )

              if matches:
                  index = matches[0]
                  latest = {
                      "symbol": symbol,
                      "form": recent["form"][index],
                      "filing_date": recent["filingDate"][index],
                      "accession": recent["accessionNumber"][index],
                  }
                  print(
                      "LATEST " + json.dumps(latest, ensure_ascii=True),
                      flush=True,
                  )

              passed += 1

          print(
              f"SUMMARY: {passed}/{len(targets)} companies passed.",
              flush=True,
          )
          print("SMH ETF source is not included in this test.")
          PY
